<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dbeafe, #f0fdfa);
            font-family: Arial, sans-serif;
        }

        .container{
            width: 600px;
            padding: 50px;
            background: linear-gradient(to right, #E0F2FE, #F0FDFA);
            margin: 50px auto;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: 0.4s ease;
        }

        .container:hover{
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        input{
            width: 65%;
            padding: 15px 20px;
            text-align: center;
            border: 2px solid transparent;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: 0.3s ease;
        }

        input:focus{
            border-color: blue;
            box-shadow: 0 0 0 4px rgba(0, 0, 255, 0.1);
        }

        button{
            padding: 15px 30px;
            text-align: center;
            background-color: blue;
            color: white;
            font-size: medium;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover{
            background-color: darkblue;
            transform: scale(1.05);
        }

        button:active{
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">
        <input type="password" placeholder="Enter Password">
        <button>Show</button>
    </div>

    <script>
        const input = document.querySelector("input")
        const Btn = document.querySelector("button")

        Btn.addEventListener("click", ()=>{
            if(input.type === "password"){
                input.type = "text";
                Btn.textContent = "Hide"
            }
            else{
                input.type = "password";
                Btn.textContent = "Show"
            }
        })
    </script>

</body>
</html>
