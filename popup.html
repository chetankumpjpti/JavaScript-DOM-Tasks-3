<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #f0fdfa);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container{
            width: 400px;
            padding: 50px;
            background-color: white;
            text-align: center;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        #Btn{
            padding: 15px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #Btn:hover{
            background-color: darkblue;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,255,0.25);
        }

        .popup{
            width: 350px;
            background: linear-gradient(to right, #E0F2FE, #F0FDFA);
            padding: 35px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%) scale(0.8);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: 0.4s ease;
        }

        .popup h3{
            color: blue;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .popup p{
            color: #475569;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .close{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .close:hover{
            background-color: darkblue;
            transform: scale(1.05);
        }

        .done{
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

<body>

    <section class="container">

        <button id="Btn">Open Popup</button>

        <div class="popup">
            <h3>Hello! Ye ek Pop-up hai</h3>

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Quos dolore repellendus obcaecati aperiam nihil.
            </p>

            <button class="close">Close</button>
        </div>

    </section>

    <script>
        const Btn = document.querySelector("#Btn")
        const popup = document.querySelector(".popup")
        const close = document.querySelector(".close")

        Btn.addEventListener("click", () =>{
            popup.classList.add("done")
        })

        close.addEventListener("click", () =>{
            popup.classList.remove("done")
        })
    </script>

</body>
</html>
