<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        header{
            width: 100%;
            height: 82px;
            background: linear-gradient(135deg, #0f766e, #115e59);
            padding: 20px;
            display: flex;
            align-items: center;
        }

        .btnOpn{
            width: fit-content;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #0f766e;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btnOpn:hover{
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .container{
            width: 500px;
            height: 100%;
            background: linear-gradient(160deg, #1e293b, #0f172a);
            color: white;
            position: fixed;
            top: 0;
            right: -100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.25);
            transition: 0.5s ease;
        }

        h3{
            font-size: 26px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        ul{
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li{
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        li:hover{
            background-color: #0f766e;
            transform: translateX(8px);
        }

        #close{
            width: fit-content;
            padding: 8px 14px;
            border: none;
            border-radius: 7px;
            background-color: #ef4444;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            margin-left: auto;
        }

        #close:hover{
            background-color: #dc2626;
            transform: scale(1.05);
        }

        .done{
            right: 0 !important;
        }
    </style>
</head>

<body>

    <header>
        <button class="btnOpn">Open Sidebar</button>

        <div class="container">
            <button id="close">Close X</button>

            <h3>Sidebar Menu</h3>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
                <li>About Us</li>
            </ul>
        </div>
    </header>

    <script>
        const slider = document.querySelector(".container")
        const BtnOpen = document.querySelector(".btnOpn")
        const close = document.querySelector("#close")

        BtnOpen.addEventListener("click", ()=>{
            slider.classList.add("done")
        })

        close.addEventListener("click", ()=>{
            slider.classList.remove("done")
        })
    </script>

</body>
</html>
